<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="t d">
<title id="t">The tech stack</title>
<desc id="d">Five tools: React 19 for UI components, Vite 6 for the dev server and build, TypeScript for type safety, Tailwind CSS for utility-first styling and Lucide for icons.</desc>
<style>
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <clipPath id="pc"><rect x="40" y="20" width="1200" height="260" rx="14"/></clipPath>
  <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#E07A5F"/>
    <stop offset="50%" stop-color="#D4A373"/>
    <stop offset="100%" stop-color="#AD4A3E"/>
  </linearGradient>
</defs>

<rect x="40" y="20" width="1200" height="260" rx="14" fill="#1E1B1A"/>
<g clip-path="url(#pc)">
  <!-- Titlebar -->
  <rect x="40" y="20" width="1200" height="44" fill="#282321"/>
  <rect x="40" y="63" width="1200" height="1" fill="#3D3432"/>
  <circle cx="66" cy="42" r="6" fill="#AD4A3E"/>
  <circle cx="86" cy="42" r="6" fill="#D4A373"/>
  <circle cx="106" cy="42" r="6" fill="#8EA885"/>
  <text x="130" y="48" font-size="15" fill="#E8E3D9" class="m">package.json</text>
  <text x="1216" y="48" font-size="15" fill="#8A7E7B" text-anchor="end" class="m"><tspan fill="#8EA885" font-weight="700">+5</tspan> dependencies</text>

  <!-- Column 1: React -->
  <g transform="translate(160, 130)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="27" ry="10.5" fill="none" stroke="#7EC8E3" stroke-width="2.5" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="27" ry="10.5" transform="rotate(60)" fill="none" stroke="#7EC8E3" stroke-width="2.5" opacity="0.85"/>
      <ellipse cx="0" cy="0" rx="27" ry="10.5" transform="rotate(120)" fill="none" stroke="#7EC8E3" stroke-width="2.5" opacity="0.85"/>
      <circle cx="0" cy="0" r="4.5" fill="#7EC8E3"/>
    </g>
  </g>
  <text class="m" x="160" y="202" font-size="22" font-weight="700" fill="#E8E3D9" text-anchor="middle">React</text>
  <text class="m" x="160" y="226" font-size="15" fill="#D4A373" text-anchor="middle">react@19</text>
  <text class="s" x="160" y="250" font-size="14" fill="#8A7E7B" text-anchor="middle">UI components</text>

  <line x1="280" y1="80" x2="280" y2="256" stroke="#3D3432" stroke-width="1"/>

  <!-- Column 2: Vite -->
  <g transform="translate(400, 130)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
      <path fill="url(#vg)" d="M12 -28 L-21 4 L-3 4 L-10 28 L22 -9 L4 -9 Z" stroke-linejoin="round" stroke="url(#vg)" stroke-width="2.5"/>
    </g>
  </g>
  <text class="m" x="400" y="202" font-size="22" font-weight="700" fill="#E8E3D9" text-anchor="middle">Vite</text>
  <text class="m" x="400" y="226" font-size="15" fill="#D4A373" text-anchor="middle">vite@6</text>
  <text class="s" x="400" y="250" font-size="14" fill="#8A7E7B" text-anchor="middle">dev server &amp; build</text>

  <line x1="520" y1="80" x2="520" y2="256" stroke="#3D3432" stroke-width="1"/>

  <!-- Column 3: TypeScript -->
  <g transform="translate(640, 130)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.04;1" keyTimes="0;0.5;1" dur="4s" repeatCount="indefinite"/>
      <rect x="-25" y="-25" width="50" height="50" rx="7" fill="#2E5A88" stroke="#4A85C5" stroke-width="1.5">
        <animate attributeName="stroke" values="#4A85C5;#7AA2F7;#4A85C5" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text class="m" x="20" y="20" font-size="24" font-weight="700" fill="#E8E3D9" text-anchor="end" letter-spacing="-1">TS</text>
    </g>
  </g>
  <text class="m" x="640" y="202" font-size="22" font-weight="700" fill="#E8E3D9" text-anchor="middle">TypeScript</text>
  <text class="m" x="640" y="226" font-size="15" fill="#D4A373" text-anchor="middle">typescript</text>
  <text class="s" x="640" y="250" font-size="14" fill="#8A7E7B" text-anchor="middle">type safety</text>

  <line x1="760" y1="80" x2="760" y2="256" stroke="#3D3432" stroke-width="1"/>

  <!-- Column 4: Tailwind CSS -->
  <g transform="translate(880, 130)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 2,-1; 0,0" dur="3.5s" repeatCount="indefinite"/>
      <path transform="translate(-32, -24) scale(2.6)" fill="#4DB6AC" d="M12.001,4.8c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624C13.666,10.618,15.027,12,18.001,12c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624C16.337,6.182,14.976,4.8,12.001,4.8z M6.001,12c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624c1.177,1.194,2.538,2.576,5.512,2.576c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624C10.337,13.382,8.976,12,6.001,12z"/>
    </g>
  </g>
  <text class="m" x="880" y="202" font-size="22" font-weight="700" fill="#E8E3D9" text-anchor="middle">Tailwind CSS</text>
  <text class="m" x="880" y="226" font-size="15" fill="#D4A373" text-anchor="middle">tailwindcss</text>
  <text class="s" x="880" y="250" font-size="14" fill="#8A7E7B" text-anchor="middle">utility styling</text>

  <line x1="1000" y1="80" x2="1000" y2="256" stroke="#3D3432" stroke-width="1"/>

  <!-- Column 5: Lucide -->
  <g transform="translate(1120, 130)">
    <g transform="translate(-25, -25) scale(2.3)" fill="none" stroke="#E07A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/>
      <g>
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
        <path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>
      </g>
    </g>
  </g>
  <text class="m" x="1120" y="202" font-size="22" font-weight="700" fill="#E8E3D9" text-anchor="middle">Lucide</text>
  <text class="m" x="1120" y="226" font-size="15" fill="#D4A373" text-anchor="middle">lucide-react</text>
  <text class="s" x="1120" y="250" font-size="14" fill="#8A7E7B" text-anchor="middle">icon set</text>
</g>
<rect x="40.5" y="20.5" width="1199" height="259" rx="13.5" fill="none" stroke="#3D3432" stroke-width="1.5"/>
</svg>
